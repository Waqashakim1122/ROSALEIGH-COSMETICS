<section class="hero-banner" aria-label="Featured products slideshow">
  <div class="hero-slides">
    <div class="hero-slide is-active">
      <img class="theme-img" src="images/hero/hero-products-natural.jpg" alt="Rosaleigh skincare products styled with olive branches">
    </div>
    <div class="hero-slide">
      <img class="theme-img" src="images/hero/hero-slide-2.jpg" alt="Rosaleigh skincare product close-up">
    </div>
    <div class="hero-slide">
      <img class="theme-img" src="images/hero/hero-slide-3.jpg" alt="Rosaleigh skincare product close-up">
    </div>
    <div class="hero-slide">
      <img class="theme-img" src="images/hero/hero-slide-4.jpg" alt="Rosaleigh skincare product close-up">
    </div>
  </div>

  <button class="hero-arrow hero-arrow-prev" type="button" aria-label="Previous slide">&#10094;</button>
  <button class="hero-arrow hero-arrow-next" type="button" aria-label="Next slide">&#10095;</button>

  <div class="hero-dots" role="tablist" aria-label="Slide navigation">
    <button class="hero-dot is-active" type="button" role="tab" aria-selected="true" aria-label="Go to slide 1"></button>
    <button class="hero-dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 2"></button>
    <button class="hero-dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 3"></button>
    <button class="hero-dot" type="button" role="tab" aria-selected="false" aria-label="Go to slide 4"></button>
  </div>
</section>

<script src="hero-slideshow.js" defer></script>
