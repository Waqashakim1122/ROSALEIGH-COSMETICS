<div>
  <form id="contact-form" onsubmit="handleContactSubmit(event)">
    <div class="form-row-2">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" placeholder="Jane" required>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" placeholder="Doe" required>
      </div>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" placeholder="jane@example.com" required>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <select>
        <option>Order Inquiry</option>
        <option>Product Question</option>
        <option>Wholesale</option>
        <option>Press</option>
        <option>Something Else</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea placeholder="How can we help?" required></textarea>
    </div>
    <button type="submit" class="btn-primary" style="width:100%;padding:16px;">Send Message</button>
    <p id="contact-success" style="display:none;color:var(--forest);font-size:13px;margin-top:14px;text-align:center;font-weight:700;">✓ Thank you! We'll be in touch shortly.</p>
  </form>
</div>
