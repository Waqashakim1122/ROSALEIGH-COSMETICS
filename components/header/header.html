<!-- FIX: kept outside </header>. #site-header has backdrop-filter, which
     (like transform) creates a new containing block for position:fixed
     descendants -- trapping the drawer inside the header's box instead of
     letting it cover the full viewport. header.js finds these by
     getElementById, so keeping them here doesn't break anything. -->
