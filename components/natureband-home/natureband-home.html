<div class="nature-band">
  <img loading="lazy" decoding="async"
    src="https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=1600&q=80"
    alt="Green Irish pasture where regenerative grass-fed cows graze"
    onerror="this.onerror=null; this.style.background='var(--forest)'; this.style.display='block'; this.style.height='100%';"
  >
  <div class="nature-band-overlay"></div>
  <div class="nature-band-content">
    <div class="container">
      <p class="eyebrow" style="color:var(--gold-light);">Our Source</p>
      <h2>Sourced from Nature.<br>Made with Integrity.</h2>
      <p>Our tallow comes from 100% grass-fed cows, raised on regenerative farms. No feedlots. No hormones. Just nature.</p>
      <button class="btn-ghost" style="color:#fff;border-color:rgba(255,255,255,0.45);">Learn Our Story</button>
    </div>
  </div>
</div>
